name: signal-stack

x-signal-stack-environment: &signal-stack-environment
  SIGNAL_STACK_ENVIRONMENT: production
  SIGNAL_STACK_BIND_ADDRESS: 0.0.0.0
  SIGNAL_STACK_DATABASE_URL: sqlite:////app/data/signal_stack.db
  SIGNAL_STACK_DATA_DIR: /app/data
  SIGNAL_STACK_REPORTS_DIR: /app/reports
  SIGNAL_STACK_AUTH_PASSWORD_HASH: ${SIGNAL_STACK_AUTH_PASSWORD_HASH:?Set SIGNAL_STACK_AUTH_PASSWORD_HASH before starting}
  SIGNAL_STACK_SESSION_SECRET: ${SIGNAL_STACK_SESSION_SECRET:?Set SIGNAL_STACK_SESSION_SECRET before starting}
  SIGNAL_STACK_SESSION_TIMEOUT_MINUTES: ${SIGNAL_STACK_SESSION_TIMEOUT_MINUTES:-30}
  SIGNAL_STACK_LLM_PROVIDER: ${SIGNAL_STACK_LLM_PROVIDER:-none}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  SIGNAL_STACK_OPENROUTER_MODEL: ${SIGNAL_STACK_OPENROUTER_MODEL:-perplexity/pplx-decider-flash-v1.3:free}
  SIGNAL_STACK_RESEARCH_SEARCH_PROVIDER: ${SIGNAL_STACK_RESEARCH_SEARCH_PROVIDER:-none}
  SIGNAL_STACK_TAVILY_API_KEY: ${SIGNAL_STACK_TAVILY_API_KEY:-}

services:
  migrate:
    build: .
    environment: *signal-stack-environment
    command: ["python", "-m", "signal_stack.cli", "init-db"]
    volumes:
      - signal_stack_data:/app/data
      - signal_stack_reports:/app/reports
    restart: "no"
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    build: .
    environment: *signal-stack-environment
    command: ["python", "scripts/run_streamlit.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - signal_stack_data:/app/data
      - signal_stack_reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *bounded-logging

  scheduler:
    build: .
    environment: *signal-stack-environment
    command: ["python", "-m", "signal_stack.cli", "scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - signal_stack_data:/app/data
      - signal_stack_reports:/app/reports
    restart: unless-stopped
    logging: *bounded-logging

volumes:
  signal_stack_data:
  signal_stack_reports:
